<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="inputG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="aiG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
    <linearGradient id="matG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef6e8"/>
    </linearGradient>
    <linearGradient id="qaG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f2ed"/>
      <stop offset="100%" stop-color="#ede8df"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c8943c" opacity="0.55"/>
    </marker>
  </defs>

  <rect width="580" height="480" fill="#fefcf9"/>

  <!-- Title -->
  <text x="290" y="18" text-anchor="middle" fill="#c8943c" font-size="8" letter-spacing="2.5" font-weight="500">WORKFLOW</text>
  <text x="290" y="36" text-anchor="middle" fill="#111" font-size="14" font-weight="600" letter-spacing="-0.3">AI-Enhanced Course Development</text>

  <!-- ── ROW 1: COURSE MATERIALS ── -->
  <text x="16" y="58" fill="#999" font-size="7" letter-spacing="1.5">COURSE MATERIALS</text>

  <rect x="16" y="66" width="155" height="30" rx="3" fill="url(#inputG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="94" y="85" text-anchor="middle" fill="#111" font-size="9" font-weight="600">Recorded Lectures</text>

  <rect x="183" y="66" width="155" height="30" rx="3" fill="url(#inputG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="261" y="85" text-anchor="middle" fill="#111" font-size="9" font-weight="600">Course Content</text>

  <rect x="350" y="66" width="155" height="30" rx="3" fill="url(#inputG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="428" y="85" text-anchor="middle" fill="#111" font-size="9" font-weight="600">TCM Expertise</text>

  <!-- Bus connector: 3 inputs → horizontal bar → 2 AI boxes -->
  <!-- Vertical drops from inputs to bar -->
  <line x1="94" y1="96" x2="94" y2="106" stroke="#c8943c" stroke-width="1" opacity="0.35"/>
  <line x1="261" y1="96" x2="261" y2="106" stroke="#c8943c" stroke-width="1" opacity="0.35"/>
  <line x1="428" y1="96" x2="428" y2="106" stroke="#c8943c" stroke-width="1" opacity="0.35"/>
  <!-- Horizontal bar -->
  <line x1="94" y1="106" x2="428" y2="106" stroke="#c8943c" stroke-width="1.2" opacity="0.35"/>
  <!-- Drops from bar to AI boxes -->
  <line x1="160" y1="106" x2="160" y2="125" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>
  <line x1="380" y1="106" x2="380" y2="125" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>

  <!-- ── ROW 2: AI PROCESSING ── -->
  <text x="16" y="124" fill="#c8943c" font-size="7" letter-spacing="1.5" font-weight="500">AI ENHANCEMENT</text>

  <rect x="46" y="130" width="220" height="36" rx="3" fill="url(#aiG)"/>
  <text x="156" y="146" text-anchor="middle" fill="#c8943c" font-size="9" font-weight="600">AI Analysis &amp; Processing</text>
  <text x="156" y="159" text-anchor="middle" fill="#b6a999" font-size="7">Whisper · ChatGPT · NotebookLM</text>

  <rect x="300" y="130" width="220" height="36" rx="3" fill="url(#aiG)"/>
  <text x="410" y="146" text-anchor="middle" fill="#c8943c" font-size="9" font-weight="600">Custom GPT Development</text>
  <text x="410" y="159" text-anchor="middle" fill="#b6a999" font-size="7">Student-facing chatbot tools</text>

  <!-- AI Processing → 4 materials (bus pattern) -->
  <line x1="156" y1="166" x2="156" y2="176" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="66" y1="176" x2="390" y2="176" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="66" y1="176" x2="66" y2="195" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>
  <line x1="174" y1="176" x2="174" y2="195" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>
  <line x1="282" y1="176" x2="282" y2="195" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>
  <line x1="390" y1="176" x2="390" y2="195" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>

  <!-- Custom GPT → Support Chatbot -->
  <line x1="510" y1="176" x2="510" y2="195" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>
  <line x1="410" y1="166" x2="410" y2="176" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="410" y1="176" x2="510" y2="176" stroke="#c8943c" stroke-width="1" opacity="0.3"/>

  <!-- ── ROW 3: GENERATED MATERIALS ── -->
  <text x="16" y="193" fill="#c8943c" font-size="7" letter-spacing="1.5" font-weight="500">OUTPUTS</text>

  <rect x="16" y="200" width="100" height="34" rx="3" fill="url(#matG)" stroke="#c8943c" stroke-width="0.8"/>
  <text x="66" y="214" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Learning</text>
  <text x="66" y="226" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Content</text>

  <rect x="124" y="200" width="100" height="34" rx="3" fill="url(#matG)" stroke="#c8943c" stroke-width="0.8"/>
  <text x="174" y="214" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Discussion</text>
  <text x="174" y="226" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Prompts</text>

  <rect x="232" y="200" width="100" height="34" rx="3" fill="url(#matG)" stroke="#c8943c" stroke-width="0.8"/>
  <text x="282" y="214" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Interactive</text>
  <text x="282" y="226" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Activities</text>

  <rect x="340" y="200" width="100" height="34" rx="3" fill="url(#matG)" stroke="#c8943c" stroke-width="0.8"/>
  <text x="390" y="214" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Accessibility</text>
  <text x="390" y="226" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Resources</text>

  <rect x="460" y="200" width="100" height="34" rx="3" fill="url(#matG)" stroke="#c8943c" stroke-width="0.8"/>
  <text x="510" y="214" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Support</text>
  <text x="510" y="226" text-anchor="middle" fill="#111" font-size="8" font-weight="600">Chatbot</text>

  <!-- ── ROW 4: REVIEW ── -->
  <!-- 4 materials → Faculty Review (bus) -->
  <line x1="66" y1="234" x2="66" y2="244" stroke="#c8943c" stroke-width="1" opacity="0.25"/>
  <line x1="282" y1="234" x2="282" y2="244" stroke="#c8943c" stroke-width="1" opacity="0.25"/>
  <line x1="66" y1="244" x2="282" y2="244" stroke="#c8943c" stroke-width="1" opacity="0.25"/>
  <line x1="170" y1="244" x2="170" y2="262" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>

  <!-- Chatbot → Chatbot Testing -->
  <line x1="510" y1="234" x2="510" y2="244" stroke="#c8943c" stroke-width="1" opacity="0.25"/>
  <line x1="450" y1="244" x2="510" y2="244" stroke="#c8943c" stroke-width="1" opacity="0.25"/>
  <line x1="450" y1="244" x2="450" y2="262" stroke="#c8943c" stroke-width="1" opacity="0.3" marker-end="url(#ar)"/>

  <text x="16" y="260" fill="#c8943c" font-size="7" letter-spacing="1.5" font-weight="500">REVIEW</text>

  <rect x="80" y="268" width="180" height="30" rx="3" fill="url(#qaG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="170" y="287" text-anchor="middle" fill="#111" font-size="9" font-weight="600">Faculty Review</text>

  <rect x="350" y="268" width="200" height="30" rx="3" fill="url(#qaG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="450" y="287" text-anchor="middle" fill="#111" font-size="9" font-weight="600">Chatbot Testing &amp; Refinement</text>

  <!-- ── ROW 5: SME → QC → Deploy ── -->
  <!-- Faculty Review + Chatbot Testing → SME (bus) -->
  <line x1="170" y1="298" x2="170" y2="308" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="450" y1="298" x2="450" y2="308" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="170" y1="308" x2="450" y2="308" stroke="#c8943c" stroke-width="1" opacity="0.3"/>
  <line x1="290" y1="308" x2="290" y2="322" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>

  <rect x="190" y="328" width="200" height="30" rx="3" fill="url(#qaG)" stroke="#c8943c" stroke-width="1"/>
  <text x="290" y="347" text-anchor="middle" fill="#111" font-size="9" font-weight="600">SME Verification</text>

  <line x1="290" y1="358" x2="290" y2="372" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>

  <rect x="210" y="378" width="160" height="30" rx="3" fill="url(#qaG)" stroke="#e0d8ce" stroke-width="1"/>
  <text x="290" y="397" text-anchor="middle" fill="#111" font-size="9" font-weight="600">Final Quality Check</text>

  <line x1="290" y1="408" x2="290" y2="422" stroke="#c8943c" stroke-width="1" opacity="0.35" marker-end="url(#ar)"/>

  <rect x="210" y="428" width="160" height="30" rx="3" fill="url(#aiG)"/>
  <text x="290" y="447" text-anchor="middle" fill="#c8943c" font-size="9" font-weight="600">Deploy to Course Platform</text>

  <!-- Footer -->
  <line x1="16" y1="466" x2="564" y2="466" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="16" y="474" width="4" height="4" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="26" y="479" fill="#666" font-size="8">Whisper for transcription</text>
  <rect x="160" y="474" width="4" height="4" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="170" y="479" fill="#666" font-size="8">ChatGPT + NotebookLM for structuring</text>
  <rect x="380" y="474" width="4" height="4" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="390" y="479" fill="#666" font-size="8">Faculty &amp; SME always in the loop</text>
</svg>
