<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="hwBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8943c"/>
      <stop offset="100%" stop-color="#9a7020"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2a24"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="parseGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a7a6a"/>
      <stop offset="100%" stop-color="#3d5a4a"/>
    </linearGradient>
    <linearGradient id="uiGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6a5a8a"/>
      <stop offset="100%" stop-color="#4a3d6a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#hwBg)"/>

  <!-- Title area -->
  <text x="40" y="40" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="2" text-transform="uppercase">SYSTEM ARCHITECTURE</text>
  <text x="40" y="68" font-size="22" font-weight="600" fill="#111" font-family="'Source Serif 4', Georgia, serif">Healing Walk: API-Driven Interactive Narrative</text>
  <text x="40" y="90" font-size="13" fill="#777">Claude API · Vanilla JS · Howler.js · Canvas Particles · Bilingual (KR/EN)</text>

  <!-- ═══ ROW 1: User → System Prompt → API ═══ -->

  <!-- User Browser box -->
  <rect x="40" y="120" width="170" height="100" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <text x="125" y="148" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="1.5">USER</text>
  <text x="125" y="170" text-anchor="middle" font-size="13" font-weight="500" fill="#111">Browser Client</text>
  <text x="125" y="189" text-anchor="middle" font-size="11" fill="#777">Language select</text>
  <text x="125" y="204" text-anchor="middle" font-size="11" fill="#777">Choice input · Turn state</text>

  <!-- Arrow: User → System Prompt -->
  <line x1="210" y1="170" x2="248" y2="170" stroke="#c8943c" stroke-width="1.5" marker-end="url(#arrowGold)"/>
  <defs>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8943c"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2a24"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a7a6a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a5a8a"/>
    </marker>
  </defs>

  <!-- System Prompt box -->
  <rect x="255" y="120" width="190" height="100" rx="4" fill="url(#accentGrad)" opacity="0.95"/>
  <text x="350" y="148" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.7)" letter-spacing="1.5">PROMPT ENGINE</text>
  <text x="350" y="170" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">System Prompt v3</text>
  <text x="350" y="189" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Narrative style control</text>
  <text x="350" y="204" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.75)">Choice format · Turn limits</text>

  <!-- Arrow: System Prompt → API -->
  <line x1="445" y1="170" x2="483" y2="170" stroke="#2d2a24" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- Claude API box -->
  <rect x="490" y="120" width="190" height="100" rx="4" fill="url(#apiGrad)"/>
  <text x="585" y="148" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">CLAUDE API</text>
  <text x="585" y="170" text-anchor="middle" font-size="13" font-weight="500" fill="#f0ece6">Messages Endpoint</text>
  <text x="585" y="189" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)">claude-sonnet-4-20250514</text>
  <text x="585" y="204" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)">+ OpenAI gpt-4.1 fallback</text>

  <!-- Arrow: API → Response Parser (down) -->
  <line x1="585" y1="220" x2="585" y2="268" stroke="#5a7a6a" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Live badge -->
  <rect x="730" y="120" width="190" height="100" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="756" cy="148" r="4" fill="#5a7a6a"/>
  <text x="768" y="152" font-size="11" font-family="'DM Mono', monospace" fill="#5a7a6a" letter-spacing="1">LIVE · DEPLOYED</text>
  <text x="825" y="174" text-anchor="middle" font-size="12" fill="#444">GitHub Pages</text>
  <text x="825" y="192" text-anchor="middle" font-size="11" fill="#777">1,467 lines · Single file</text>
  <text x="825" y="208" text-anchor="middle" font-size="11" fill="#777">No framework / No build</text>

  <!-- ═══ ROW 2: Response Parser ═══ -->

  <rect x="420" y="275" width="330" height="80" rx="4" fill="url(#parseGrad)"/>
  <text x="585" y="300" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">RESPONSE PARSER</text>
  <text x="585" y="322" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">Tag Extraction Pipeline</text>
  <text x="585" y="341" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.7)">[AMBIENCE:id] · [SCENE:id] · [SURPRISE:emoji:text] · ---DIARY--- · Choices A/B/C</text>

  <!-- ═══ ROW 3: Four output branches ═══ -->

  <!-- Branch arrows down from parser -->
  <line x1="480" y1="355" x2="130" y2="395" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="530" y1="355" x2="350" y2="395" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="640" y1="355" x2="585" y2="395" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="690" y1="355" x2="825" y2="395" stroke="#6a5a8a" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Output 1: Scene -->
  <rect x="40" y="400" width="180" height="105" rx="4" fill="url(#uiGrad)"/>
  <text x="130" y="425" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1">SCENE LAYER</text>
  <text x="130" y="447" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">21 Pixel Art Scenes</text>
  <text x="130" y="466" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">5 ambiences × 4-5 scenes</text>
  <text x="130" y="483" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">CSS crossfade transitions</text>

  <!-- Output 2: Sound -->
  <rect x="240" y="400" width="195" height="105" rx="4" fill="url(#uiGrad)"/>
  <text x="337" y="425" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1">SOUND LAYER</text>
  <text x="337" y="447" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Howler.js Ambience</text>
  <text x="337" y="466" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">5 loop tracks · Crossfade</text>
  <text x="337" y="483" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Autoplay policy handling</text>

  <!-- Output 3: Particles + Narration -->
  <rect x="455" y="400" width="210" height="105" rx="4" fill="url(#uiGrad)"/>
  <text x="560" y="425" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1">INTERACTION LAYER</text>
  <text x="560" y="447" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Narration + Choices</text>
  <text x="560" y="466" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Canvas particles per ambience</text>
  <text x="560" y="483" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Glassmorphism UI panel</text>

  <!-- Output 4: State -->
  <rect x="685" y="400" width="235" height="105" rx="4" fill="url(#uiGrad)"/>
  <text x="802" y="425" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1">STATE MANAGEMENT</text>
  <text x="802" y="447" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Turn + History + i18n</text>
  <text x="802" y="466" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Full convo history per API call</text>
  <text x="802" y="483" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">22-turn limit (client + server)</text>

  <!-- Feedback loop arrow from State back to User -->
  <path d="M 685 470 Q 40 520 40 200" fill="none" stroke="#c8943c" stroke-width="1" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="28" y="350" font-size="10" fill="#c8943c" transform="rotate(-90, 28, 350)" text-anchor="middle">USER CHOICE LOOP</text>

</svg>
