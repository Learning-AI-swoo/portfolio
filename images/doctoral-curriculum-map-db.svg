<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="lightPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="goldPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(200,148,60,0.10)"/>
      <stop offset="100%" stop-color="rgba(200,148,60,0.04)"/>
    </linearGradient>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M2 2L8 5L2 8" fill="none" stroke="#c8943c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#darkBg)"/>

  <!-- Title -->
  <text x="480" y="38" text-anchor="middle" fill="#c8943c" font-size="10" letter-spacing="3" font-weight="500">CURRICULUM MAPPING INFRASTRUCTURE</text>
  <text x="480" y="64" text-anchor="middle" fill="#f0ece6" font-size="20" font-weight="600" letter-spacing="-0.5">From Manual Documents to Queryable Database</text>

  <!-- ── BEFORE panel ── -->
  <rect x="40" y="90" width="380" height="340" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(200,148,60,0.15)" stroke-width="1"/>
  <text x="230" y="118" text-anchor="middle" fill="#b6a999" font-size="10" letter-spacing="2.5">BEFORE</text>

  <!-- Scattered doc stacks -->
  <!-- Doc 1: Word -->
  <rect x="64" y="136" width="140" height="72" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="64" y="136" width="140" height="20" rx="3" fill="rgba(255,255,255,0.07)"/>
  <text x="134" y="150" text-anchor="middle" fill="#b6a999" font-size="11" font-weight="500">program_outcomes.docx</text>



  <rect x="76" y="165" width="80" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="76" y="176" width="110" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="76" y="187" width="60" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>

  <!-- Doc 2: Excel -->
  <rect x="216" y="136" width="140" height="72" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="216" y="136" width="140" height="20" rx="3" fill="rgba(255,255,255,0.07)"/>
  <text x="286" y="150" text-anchor="middle" fill="#b6a999" font-size="11" font-weight="500">curriculum_mapping.xlsx</text>
  <!-- Spreadsheet grid -->
  <line x1="228" y1="165" x2="344" y2="165" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="228" y1="174" x2="344" y2="174" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="228" y1="183" x2="344" y2="183" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="268" y1="156" x2="268" y2="198" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="308" y1="156" x2="308" y2="198" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Doc 3: Another Excel -->
  <rect x="64" y="224" width="140" height="72" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="64" y="224" width="140" height="20" rx="3" fill="rgba(255,255,255,0.07)"/>
  <text x="134" y="238" text-anchor="middle" fill="#b6a999" font-size="11" font-weight="500">competency_map_v2.xlsx</text>
  <line x1="76" y1="253" x2="192" y2="253" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="76" y1="262" x2="192" y2="262" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="76" y1="271" x2="192" y2="271" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="116" y1="244" x2="116" y2="286" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <line x1="156" y1="244" x2="156" y2="286" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Doc 4: Word -->
  <rect x="216" y="224" width="140" height="72" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
  <rect x="216" y="224" width="140" height="20" rx="3" fill="rgba(255,255,255,0.07)"/>
  <text x="286" y="238" text-anchor="middle" fill="#b6a999" font-size="11" font-weight="500">course_outcomes.docx</text>
  <rect x="228" y="253" width="90" height="5" rx="2" fill="rgba(255,255,255,0.08)"/>
  <rect x="228" y="264" width="110" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>
  <rect x="228" y="275" width="70" height="5" rx="2" fill="rgba(255,255,255,0.05)"/>

  <!-- Pain point callout -->
  <rect x="64" y="316" width="292" height="84" rx="3" fill="rgba(200,60,60,0.06)" stroke="rgba(200,60,60,0.20)" stroke-width="1"/>
  <rect x="64" y="316" width="3" height="84" rx="1.5" fill="rgba(200,80,80,0.5)"/>
  <text x="80" y="337" fill="#e08888" font-size="11" letter-spacing="1.5" font-weight="500">PAIN POINTS</text>
  <text x="80" y="357" fill="#b6a999" font-size="12">No single source of truth</text>
  <text x="80" y="374" fill="#b6a999" font-size="12">Cross-referencing 4 programs manually</text>
  <text x="80" y="391" fill="#b6a999" font-size="12">One mapping cycle: ~5–7 days</text>

  <!-- ── ARROW ── -->
  <line x1="444" y1="260" x2="516" y2="260" stroke="#c8943c" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6" marker-end="url(#arrowGold)"/>
  <text x="480" y="252" text-anchor="middle" fill="#c8943c" font-size="10" letter-spacing="1.5" opacity="0.7">REBUILT AS</text>

  <!-- ── AFTER panel ── -->
  <rect x="540" y="90" width="380" height="340" rx="4" fill="url(#goldPanel)" stroke="rgba(200,148,60,0.30)" stroke-width="1"/>
  <text x="730" y="118" text-anchor="middle" fill="#c8943c" font-size="10" letter-spacing="2.5">AFTER</text>

  <!-- JSON DB block -->
  <rect x="564" y="132" width="332" height="112" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(200,148,60,0.22)" stroke-width="1"/>
  <text x="580" y="155" fill="#c8943c" font-size="10" letter-spacing="2" font-weight="500">NORMALIZED JSON DATABASE</text>
  <!-- JSON lines -->
  <text x="580" y="176" fill="#8a7e6e" font-size="11" font-family="'Courier New', monospace">{ "program": "DAc",</text>
  <text x="580" y="192" fill="#8a7e6e" font-size="11" font-family="'Courier New', monospace">  "domain": "Patient Care",</text>
  <text x="580" y="208" fill="#8a7e6e" font-size="11" font-family="'Courier New', monospace">  "level": "mastery",</text>
  <text x="580" y="224" fill="#8a7e6e" font-size="11" font-family="'Courier New', monospace">  "course_outcomes": [...] }</text>

  <!-- Query outputs -->
  <text x="564" y="270" fill="#b6a999" font-size="10" letter-spacing="2">QUERYABLE BY</text>
  <rect x="564" y="280" width="96" height="34" rx="3" fill="rgba(200,148,60,0.08)" stroke="rgba(200,148,60,0.25)" stroke-width="1"/>
  <text x="612" y="301" text-anchor="middle" fill="#f0ece6" font-size="12" font-weight="500">Program</text>

  <rect x="670" y="280" width="96" height="34" rx="3" fill="rgba(200,148,60,0.08)" stroke="rgba(200,148,60,0.25)" stroke-width="1"/>
  <text x="718" y="301" text-anchor="middle" fill="#f0ece6" font-size="12" font-weight="500">Domain</text>

  <rect x="776" y="280" width="96" height="34" rx="3" fill="rgba(200,148,60,0.08)" stroke="rgba(200,148,60,0.25)" stroke-width="1"/>
  <text x="824" y="301" text-anchor="middle" fill="#f0ece6" font-size="12" font-weight="500">Course</text>

  <!-- Outcome callout -->
  <rect x="564" y="326" width="292" height="84" rx="3" fill="rgba(60,140,100,0.07)" stroke="rgba(80,180,130,0.22)" stroke-width="1"/>
  <rect x="564" y="326" width="3" height="84" rx="1.5" fill="rgba(80,180,130,0.5)"/>
  <text x="580" y="347" fill="#7ec8a8" font-size="11" letter-spacing="1.5" font-weight="500">RESULT</text>
  <text x="580" y="367" fill="#b6a999" font-size="12">Single source of truth across all programs</text>
  <text x="580" y="384" fill="#b6a999" font-size="12">Accreditation reports generated on demand</text>
  <text x="580" y="401" fill="#b6a999" font-size="12">One mapping cycle: minutes, not days</text>

  <!-- Footer -->
  <line x1="40" y1="450" x2="920" y2="450" stroke="rgba(200,148,60,0.12)" stroke-width="1"/>
  <text x="480" y="467" text-anchor="middle" fill="#8a7e6e" font-size="11">4 degree programs · 14 accreditation domains · introductory / advanced / mastery course-level alignment</text>
</svg>
