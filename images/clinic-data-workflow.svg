<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="srcGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef6e8"/>
    </linearGradient>
    <linearGradient id="mergeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e6"/>
      <stop offset="100%" stop-color="#ede6d8"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#c8943c" opacity="0.55"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="760" height="420" fill="#fefcf9"/>

  <!-- Title -->
  <text x="380" y="22" text-anchor="middle" fill="#c8943c" font-size="9" letter-spacing="2.5" font-weight="500">DATA PIPELINE</text>
  <text x="380" y="42" text-anchor="middle" fill="#111" font-size="16" font-weight="600" letter-spacing="-0.3">Clinic Data Workflow</text>

  <!-- Column labels -->
  <text x="16" y="66" fill="#c8943c" font-size="8" letter-spacing="2" font-weight="500">SOURCES</text>
  <text x="260" y="66" fill="#c8943c" font-size="8" letter-spacing="2" font-weight="500">WRANGLING</text>
  <text x="445" y="66" fill="#c8943c" font-size="8" letter-spacing="2" font-weight="500">MERGE</text>
  <text x="570" y="66" fill="#c8943c" font-size="8" letter-spacing="2" font-weight="500">OUTPUTS</text>

  <!-- ── EHR SOURCES ── -->
  <text x="16" y="86" fill="#999" font-size="8" letter-spacing="1">EHR SYSTEM</text>

  <rect x="16" y="94" width="175" height="38" rx="3" fill="url(#srcGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="20" y="98" width="3" height="14" rx="1.5" fill="#c8943c" opacity="0.6"/>
  <text x="30" y="110" fill="#111" font-size="10" font-weight="600">Clinic Report</text>
  <text x="30" y="124" fill="#888" font-size="8">Detailed visit records</text>

  <rect x="16" y="138" width="175" height="38" rx="3" fill="url(#srcGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="20" y="142" width="3" height="14" rx="1.5" fill="#c8943c" opacity="0.6"/>
  <text x="30" y="154" fill="#111" font-size="10" font-weight="600">Herb Sales</text>
  <text x="30" y="168" fill="#888" font-size="8">In-appt &amp; outside-appt</text>

  <rect x="16" y="182" width="175" height="38" rx="3" fill="url(#srcGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="20" y="186" width="3" height="14" rx="1.5" fill="#c8943c" opacity="0.6"/>
  <text x="30" y="198" fill="#111" font-size="10" font-weight="600">Custom Export</text>
  <text x="30" y="212" fill="#888" font-size="8">Quarterly data pulls</text>

  <!-- ── POPULI SOURCES ── -->
  <text x="16" y="240" fill="#999" font-size="8" letter-spacing="1">POPULI SIS</text>

  <rect x="16" y="248" width="175" height="38" rx="3" fill="url(#srcGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="20" y="252" width="3" height="14" rx="1.5" fill="#c8943c" opacity="0.6"/>
  <text x="30" y="264" fill="#111" font-size="10" font-weight="600">Enrollment Data</text>
  <text x="30" y="278" fill="#888" font-size="8">Student info &amp; registration</text>

  <rect x="16" y="292" width="175" height="38" rx="3" fill="url(#srcGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="20" y="296" width="3" height="14" rx="1.5" fill="#c8943c" opacity="0.6"/>
  <text x="30" y="308" fill="#111" font-size="10" font-weight="600">Clinic Shift Data</text>
  <text x="30" y="322" fill="#888" font-size="8">Treatment &amp; shift counts</text>

  <!-- ── WRANGLING ── -->
  <rect x="260" y="118" width="140" height="48" rx="3" fill="url(#processGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <text x="330" y="139" text-anchor="middle" fill="#111" font-size="10" font-weight="600">EHR Wrangling</text>
  <text x="330" y="154" text-anchor="middle" fill="#888" font-size="8">Python · PQ · x-reference</text>

  <rect x="260" y="254" width="140" height="48" rx="3" fill="url(#processGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <text x="330" y="275" text-anchor="middle" fill="#111" font-size="10" font-weight="600">Populi Wrangling</text>
  <text x="330" y="290" text-anchor="middle" fill="#888" font-size="8">Python · PQ · x-reference</text>

  <!-- ── MERGE ── -->
  <rect x="440" y="182" width="80" height="60" rx="3" fill="url(#mergeGrad)" stroke="#c8943c" stroke-width="1.2"/>
  <text x="480" y="208" text-anchor="middle" fill="#111" font-size="10" font-weight="700">Merge</text>
  <text x="480" y="222" text-anchor="middle" fill="#888" font-size="8">Normalize &amp; combine</text>

  <!-- ── OUTPUTS ── -->
  <rect x="564" y="128" width="115" height="46" rx="3" fill="url(#outputGrad)"/>
  <text x="622" y="148" text-anchor="middle" fill="#c8943c" font-size="10" font-weight="600">Power BI</text>
  <text x="622" y="163" text-anchor="middle" fill="#b6a999" font-size="8">Dashboards &amp; reports</text>

  <rect x="564" y="189" width="115" height="46" rx="3" fill="url(#outputGrad)"/>
  <text x="622" y="209" text-anchor="middle" fill="#c8943c" font-size="10" font-weight="600">Board Reporting</text>
  <text x="622" y="224" text-anchor="middle" fill="#b6a999" font-size="8">Exam &amp; outcomes</text>

  <rect x="564" y="250" width="115" height="46" rx="3" fill="url(#outputGrad)"/>
  <text x="622" y="270" text-anchor="middle" fill="#c8943c" font-size="10" font-weight="600">Planning Data</text>
  <text x="622" y="285" text-anchor="middle" fill="#b6a999" font-size="8">Decision support</text>

  <!-- ══ ARROWS ══ -->
  <!-- EHR sources → EHR Wrangling -->
  <line x1="191" y1="113" x2="257" y2="135" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="191" y1="157" x2="257" y2="145" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="191" y1="201" x2="257" y2="155" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Populi sources → Populi Wrangling -->
  <line x1="191" y1="267" x2="257" y2="272" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="191" y1="311" x2="257" y2="288" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Wrangling → Merge -->
  <line x1="400" y1="145" x2="437" y2="198" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="400" y1="278" x2="437" y2="225" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>

  <!-- Merge → Outputs -->
  <line x1="520" y1="200" x2="561" y2="155" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="520" y1="212" x2="561" y2="212" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>
  <line x1="520" y1="225" x2="561" y2="270" stroke="#c8943c" stroke-width="1.2" opacity="0.4" marker-end="url(#arr)"/>

  <!-- ── Bottom note ── -->
  <line x1="16" y1="352" x2="744" y2="352" stroke="#e0d8ce" stroke-width="1"/>
  <text x="16" y="372" fill="#c8943c" font-size="8" letter-spacing="2" font-weight="500">KEY DECISIONS</text>
  <rect x="16" y="384" width="5" height="5" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="28" y="390" fill="#666" font-size="10">On-premises processing for privacy-sensitive clinic data</text>
  <rect x="270" y="384" width="5" height="5" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="282" y="390" fill="#666" font-size="10">Python + Power Query for cross-system reconciliation</text>
  <rect x="540" y="384" width="5" height="5" rx="1" fill="#c8943c" opacity="0.5"/>
  <text x="552" y="390" fill="#666" font-size="10">Automated recurring reports</text>
</svg>
