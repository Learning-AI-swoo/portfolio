<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="focusGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef6e8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#fefcf9"/>

  <!-- Top header bar -->
  <rect x="40" y="36" width="880" height="88" rx="4" fill="url(#headerGrad)"/>
  <text x="480" y="68" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="3" font-weight="500">PROGRAM ARCHITECTURE</text>
  <text x="480" y="98" text-anchor="middle" fill="#f0ece6" font-size="24" font-weight="600" letter-spacing="-0.5">Professional Doctoral Program</text>

  <!-- CORE COURSES section -->
  <rect x="40" y="154" width="440" height="36" rx="3" fill="#1a1814"/>
  <text x="260" y="178" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">CORE COURSES</text>

  <!-- Core course cards -->
  <rect x="40" y="202" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="238" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="242" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">01</text>
  <text x="96" y="232" fill="#111" font-size="15" font-weight="600">Collaborative Care</text>
  <text x="96" y="252" fill="#777" font-size="12">Interprofessional practice and team-based models</text>

  <rect x="40" y="284" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="320" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="324" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">02</text>
  <text x="96" y="314" fill="#111" font-size="15" font-weight="600">Healthcare Systems</text>
  <text x="96" y="334" fill="#777" font-size="12">Systems navigation, policy, and institutional context</text>

  <rect x="40" y="366" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="402" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="406" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">03</text>
  <text x="96" y="396" fill="#111" font-size="15" font-weight="600">Advanced Practice Management</text>
  <text x="96" y="416" fill="#777" font-size="12">Clinical leadership and practice operations</text>

  <!-- CLINICAL FOCUS section -->
  <rect x="520" y="154" width="400" height="36" rx="3" fill="#1a1814"/>
  <text x="720" y="178" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">CLINICAL FOCUS AREAS</text>

  <!-- Focus area cards -->
  <rect x="520" y="202" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="524" y="206" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="540" y="224" fill="#111" font-size="14" font-weight="600">Cancer Care</text>
  <text x="540" y="244" fill="#777" font-size="11">Oncology support and</text>
  <text x="540" y="259" fill="#777" font-size="11">integrative protocols</text>

  <rect x="730" y="202" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="734" y="206" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="750" y="224" fill="#111" font-size="14" font-weight="600">Mental Health &amp;</text>
  <text x="750" y="242" fill="#111" font-size="14" font-weight="600">Trauma-Informed Care</text>
  <text x="750" y="264" fill="#777" font-size="11">Behavioral health integration</text>

  <rect x="520" y="308" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="524" y="312" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="540" y="330" fill="#111" font-size="14" font-weight="600">Orthopedics</text>
  <text x="540" y="350" fill="#777" font-size="11">Musculoskeletal assessment</text>
  <text x="540" y="365" fill="#777" font-size="11">and treatment planning</text>

  <rect x="730" y="308" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="734" y="312" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="750" y="330" fill="#111" font-size="14" font-weight="600">Reproductive Health</text>
  <text x="750" y="350" fill="#777" font-size="11">Fertility, prenatal, and</text>
  <text x="750" y="365" fill="#777" font-size="11">postpartum care models</text>

  <!-- Separator -->
  <rect x="40" y="468" width="880" height="1" fill="#e0d8ce"/>

  <!-- Delivery model bar -->
  <rect x="40" y="490" width="880" height="180" rx="3" fill="#f5f2ed" stroke="#e0d8ce" stroke-width="1"/>
  <text x="80" y="524" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">DELIVERY MODEL</text>

  <!-- Delivery details -->
  <rect x="80" y="546" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="556" fill="#444" font-size="13">100% online delivery — synchronous and asynchronous</text>

  <rect x="80" y="576" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="586" fill="#444" font-size="13">ACAHM competency-aligned curriculum architecture</text>

  <rect x="80" y="606" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="616" fill="#444" font-size="13">Documented clock-hour logic for distance education compliance</text>

  <rect x="520" y="546" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="556" fill="#444" font-size="13">Case analysis, virtual rounds, peer collaboration</text>

  <rect x="520" y="576" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="586" fill="#444" font-size="13">National recruitment model</text>

  <rect x="520" y="606" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="616" fill="#444" font-size="13">Faculty implementation guidance and LMS structure</text>

  <!-- Footer line -->
  <line x1="40" y1="698" x2="920" y2="698" stroke="#e0d8ce" stroke-width="1"/>
</svg>
