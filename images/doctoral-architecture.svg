<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="100%" stop-color="#2a2520"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="focusGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff9f0"/>
      <stop offset="100%" stop-color="#fef6e8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="960" height="680" fill="#fefcf9" rx="0"/>

  <!-- Top header bar -->
  <rect x="40" y="36" width="880" height="88" rx="4" fill="url(#headerGrad)"/>
  <text x="480" y="68" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="3" font-weight="500" text-transform="uppercase">PROGRAM ARCHITECTURE</text>
  <text x="480" y="98" text-anchor="middle" fill="#f0ece6" font-size="24" font-weight="600" letter-spacing="-0.5">Professional Doctoral Program</text>



  <!-- CORE COURSES section -->
  <rect x="40" y="186" width="440" height="36" rx="3" fill="#1a1814"/>
  <text x="260" y="210" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">CORE COURSES</text>

  <!-- Core course cards -->
  <rect x="40" y="234" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="270" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="274" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">01</text>
  <text x="96" y="264" fill="#111" font-size="15" font-weight="600">Collaborative Care</text>
  <text x="96" y="284" fill="#777" font-size="12">Interprofessional practice and team-based models</text>

  <rect x="40" y="316" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="352" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="356" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">02</text>
  <text x="96" y="346" fill="#111" font-size="15" font-weight="600">Healthcare Systems</text>
  <text x="96" y="366" fill="#777" font-size="12">Systems navigation, policy, and institutional context</text>

  <rect x="40" y="398" width="440" height="72" rx="3" fill="url(#coreGrad)" stroke="#e0d8ce" stroke-width="1"/>
  <circle cx="68" cy="434" r="14" fill="none" stroke="#c8943c" stroke-width="1.2" opacity="0.6"/>
  <text x="68" y="438" text-anchor="middle" fill="#c8943c" font-size="11" font-weight="600">03</text>
  <text x="96" y="428" fill="#111" font-size="15" font-weight="600">Advanced Practice Management</text>
  <text x="96" y="448" fill="#777" font-size="12">Clinical leadership and practice operations</text>

  <!-- CLINICAL FOCUS section -->
  <rect x="520" y="186" width="400" height="36" rx="3" fill="#1a1814"/>
  <text x="720" y="210" text-anchor="middle" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">CLINICAL FOCUS AREAS</text>

  <!-- Focus area cards -->
  <rect x="520" y="234" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="524" y="238" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="540" y="256" fill="#111" font-size="14" font-weight="600">Cancer Care</text>
  <text x="540" y="276" fill="#777" font-size="11">Oncology support and</text>
  <text x="540" y="291" fill="#777" font-size="11">integrative protocols</text>

  <rect x="730" y="234" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="734" y="238" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="750" y="256" fill="#111" font-size="14" font-weight="600">Mental Health &amp;</text>
  <text x="750" y="274" fill="#111" font-size="14" font-weight="600">Trauma-Informed Care</text>
  <text x="750" y="296" fill="#777" font-size="11">Behavioral health integration</text>

  <rect x="520" y="340" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="524" y="344" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="540" y="362" fill="#111" font-size="14" font-weight="600">Orthopedics</text>
  <text x="540" y="382" fill="#777" font-size="11">Musculoskeletal assessment</text>
  <text x="540" y="397" fill="#777" font-size="11">and treatment planning</text>

  <rect x="730" y="340" width="190" height="92" rx="3" fill="url(#focusGrad)" stroke="#c8943c" stroke-width="1" opacity="0.9"/>
  <rect x="734" y="344" width="4" height="28" rx="2" fill="#c8943c" opacity="0.7"/>
  <text x="750" y="362" fill="#111" font-size="14" font-weight="600">Reproductive Health</text>
  <text x="750" y="382" fill="#777" font-size="11">Fertility, prenatal, and</text>
  <text x="750" y="397" fill="#777" font-size="11">postpartum care models</text>

  <!-- Delivery model bar -->
  <rect x="40" y="500" width="880" height="1" fill="#e0d8ce"/>

  <rect x="40" y="520" width="880" height="120" rx="3" fill="#f5f2ed" stroke="#e0d8ce" stroke-width="1"/>
  <text x="80" y="550" fill="#c8943c" font-size="11" letter-spacing="2.5" font-weight="500">DELIVERY MODEL</text>

  <!-- Delivery details -->
  <rect x="80" y="566" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="576" fill="#444" font-size="13">100% online delivery — synchronous and asynchronous</text>

  <rect x="80" y="592" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="602" fill="#444" font-size="13">ACAHM competency-aligned curriculum architecture</text>

  <rect x="80" y="618" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="100" y="628" fill="#444" font-size="13">Documented clock-hour logic for distance education compliance</text>

  <rect x="520" y="566" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="576" fill="#444" font-size="13">Case analysis, virtual rounds, peer collaboration</text>

  <rect x="520" y="592" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="602" fill="#444" font-size="13">National recruitment model</text>

  <rect x="520" y="618" width="10" height="10" rx="2" fill="#c8943c" opacity="0.5"/>
  <text x="540" y="628" fill="#444" font-size="13">Faculty implementation guidance and LMS structure</text>

  <!-- Footer line -->
  <line x1="40" y1="660" x2="920" y2="660" stroke="#e0d8ce" stroke-width="1"/>
</svg>
