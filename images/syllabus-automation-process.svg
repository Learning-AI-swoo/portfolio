<svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="saBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fefcf9"/>
      <stop offset="100%" stop-color="#f5f2ed"/>
    </linearGradient>
    <linearGradient id="saAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8943c"/>
      <stop offset="100%" stop-color="#9a7020"/>
    </linearGradient>
    <linearGradient id="saDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d2a24"/>
      <stop offset="100%" stop-color="#1a1814"/>
    </linearGradient>
    <linearGradient id="saGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a7a6a"/>
      <stop offset="100%" stop-color="#3d5a4a"/>
    </linearGradient>
    <linearGradient id="saBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a6a8a"/>
      <stop offset="100%" stop-color="#3a5070"/>
    </linearGradient>
    <linearGradient id="saRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a5a4a"/>
      <stop offset="100%" stop-color="#6a4035"/>
    </linearGradient>
    <marker id="saArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8943c"/>
    </marker>
    <marker id="saArrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d2a24"/>
    </marker>
    <marker id="saArrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a7a6a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#saBg)"/>

  <!-- Title -->
  <text x="40" y="40" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="2">PROCESS ARCHITECTURE</text>
  <text x="40" y="68" font-size="22" font-weight="600" fill="#111" font-family="'Source Serif 4', Georgia, serif">Syllabus Analysis Automation with Claude Code</text>
  <text x="40" y="90" font-size="13" fill="#777">444 syllabi · NCCAOM board exam cross-reference · Iterative prompt refinement · ~30 min vs. ~2 weeks manual</text>

  <!-- ═══ MAIN FLOW (top) ═══ -->

  <!-- Input: Syllabi -->
  <rect x="40" y="120" width="150" height="95" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <text x="115" y="146" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="1.5">INPUT</text>
  <text x="115" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#111">444 Syllabi</text>
  <text x="115" y="186" text-anchor="middle" font-size="11" fill="#777">.docx files</text>
  <text x="115" y="201" text-anchor="middle" font-size="11" fill="#777">Varied formatting</text>

  <!-- Arrow -->
  <line x1="190" y1="167" x2="228" y2="167" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Claude Code -->
  <rect x="235" y="120" width="200" height="95" rx="4" fill="url(#saDark)"/>
  <text x="335" y="146" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.5)" letter-spacing="1.5">CLAUDE CODE</text>
  <text x="335" y="168" text-anchor="middle" font-size="13" font-weight="500" fill="#f0ece6">Autonomous Agent</text>
  <text x="335" y="187" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)">Reads files · Writes Python</text>
  <text x="335" y="202" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.55)">Executes · Iterates on errors</text>

  <!-- Arrow -->
  <line x1="435" y1="167" x2="473" y2="167" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Extraction -->
  <rect x="480" y="120" width="190" height="95" rx="4" fill="url(#saGreen)"/>
  <text x="575" y="146" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">EXTRACTION</text>
  <text x="575" y="168" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">Semantic Parsing</text>
  <text x="575" y="187" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Finds textbook sections</text>
  <text x="575" y="202" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Handles citation format variants</text>

  <!-- Arrow -->
  <line x1="670" y1="167" x2="708" y2="167" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Output -->
  <rect x="715" y="120" width="205" height="95" rx="4" fill="url(#saBlue)"/>
  <text x="817" y="146" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="rgba(255,255,255,0.6)" letter-spacing="1.5">OUTPUT</text>
  <text x="817" y="168" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">Master Spreadsheet</text>
  <text x="817" y="187" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">Title · Author · ISBN</text>
  <text x="817" y="202" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.65)">NCCAOM match ✓/✗ · Sources</text>

  <!-- ═══ NCCAOM Reference (parallel input) ═══ -->

  <rect x="40" y="240" width="150" height="80" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <text x="115" y="264" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="1.5">REFERENCE</text>
  <text x="115" y="286" text-anchor="middle" font-size="13" font-weight="500" fill="#111">NCCAOM PDFs</text>
  <text x="115" y="304" text-anchor="middle" font-size="11" fill="#777">4 content outlines</text>

  <!-- Arrow from NCCAOM to extraction area -->
  <path d="M 190 280 L 430 280 Q 460 280 480 240 L 500 215" fill="none" stroke="#c8943c" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="340" y="272" text-anchor="middle" font-size="10" fill="#9a7020">Bibliography extraction + fuzzy matching</text>

  <!-- ═══ ITERATION STORY (bottom half) ═══ -->

  <text x="40" y="365" font-size="11" font-family="'DM Mono', monospace" fill="#c8943c" letter-spacing="2">PROMPT REFINEMENT ITERATIONS</text>
  <line x1="40" y1="375" x2="920" y2="375" stroke="#e0d8ce" stroke-width="1"/>

  <!-- Version 1 -->
  <rect x="40" y="390" width="195" height="110" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="40" y="390" width="195" height="26" rx="4" fill="url(#saRed)"/>
  <rect x="40" y="404" width="195" height="2" fill="url(#saRed)"/>
  <text x="137" y="407" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">v1: Single pass</text>
  <text x="137" y="438" text-anchor="middle" font-size="11" fill="#444">All 444 files at once</text>
  <text x="137" y="456" text-anchor="middle" font-size="11" fill="#444">Basic extraction prompt</text>
  <text x="137" y="480" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#8a5a4a">✗ Dedup failures</text>

  <!-- Arrow -->
  <line x1="235" y1="445" x2="268" y2="445" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Version 2 -->
  <rect x="275" y="390" width="195" height="110" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="275" y="390" width="195" height="26" rx="4" fill="url(#saRed)"/>
  <rect x="275" y="404" width="195" height="2" fill="url(#saRed)"/>
  <text x="372" y="407" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">v2: Fuzzy matching</text>
  <text x="372" y="438" text-anchor="middle" font-size="11" fill="#444">70% title match threshold</text>
  <text x="372" y="456" text-anchor="middle" font-size="11" fill="#444">Author normalization</text>
  <text x="372" y="480" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#8a5a4a">✗ Still missing dupes</text>

  <!-- Arrow -->
  <line x1="470" y1="445" x2="503" y2="445" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Version 3 -->
  <rect x="510" y="390" width="195" height="110" rx="4" fill="#fff" stroke="#e0d8ce" stroke-width="1"/>
  <rect x="510" y="390" width="195" height="26" rx="4" fill="url(#saRed)"/>
  <rect x="510" y="404" width="195" height="2" fill="url(#saRed)"/>
  <text x="607" y="407" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">v3: Two-step process</text>
  <text x="607" y="438" text-anchor="middle" font-size="11" fill="#444">Extract first, then dedup</text>
  <text x="607" y="456" text-anchor="middle" font-size="11" fill="#444">Aggressive matching rules</text>
  <text x="607" y="480" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#8a5a4a">✗ Format variance</text>

  <!-- Arrow -->
  <line x1="705" y1="445" x2="738" y2="445" stroke="#c8943c" stroke-width="1.5" marker-end="url(#saArrow)"/>

  <!-- Version 4 (success) -->
  <rect x="745" y="390" width="175" height="110" rx="4" fill="#fff" stroke="#5a7a6a" stroke-width="2"/>
  <rect x="745" y="390" width="175" height="26" rx="4" fill="url(#saGreen)"/>
  <rect x="745" y="404" width="175" height="2" fill="url(#saGreen)"/>
  <text x="832" y="407" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">v4: Subject-specific</text>
  <text x="832" y="438" text-anchor="middle" font-size="11" fill="#444">Per-subject subfolders</text>
  <text x="832" y="456" text-anchor="middle" font-size="11" fill="#444">Semantic name detection</text>
  <text x="832" y="480" text-anchor="middle" font-size="11" font-family="'DM Mono', monospace" fill="#5a7a6a">✓ Accurate output</text>

  <!-- Time savings callout -->
  <rect x="40" y="515" width="920" height="20" rx="0" fill="none"/>
  <text x="480" y="530" text-anchor="middle" font-size="12" fill="#777">Manual: ~2 weeks  →  Claude Code: ~30 minutes  →  </text>
  <text x="700" y="530" font-size="12" font-weight="600" fill="#c8943c">97% time reduction</text>

</svg>
